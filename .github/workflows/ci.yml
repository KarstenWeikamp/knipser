name: knipser CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wayland-protocols libwayland-dev libcairo2-dev libpng-dev pkg-config cmake cppcheck

    - name: Static Code Analysis (cppcheck)
      run: |
        cppcheck --enable=warning,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem *.c *.h

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --config Debug

    - name: Test
      run: cd build && ctest --output-on-failure

  release:
    needs: build_and_test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wayland-protocols libwayland-dev libcairo2-dev libpng-dev pkg-config cmake

    - name: Configure CMake (Release)
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build (Release)
      run: cmake --build build --config Release

    - name: Create GitHub Release and Upload Artifact
      uses: softprops/action-gh-release@v2
      with:
        files: build/knipser_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
